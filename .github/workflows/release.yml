name: Build and Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Code Style (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build Mod Release Jar
        run: ./gradlew build

      - name: Stage Multi-Platform Release Artifacts
        run: |
          mkdir -p release_artifacts
          # 1. 挂载标准 NeoForge 1.21.1 工件
          for jar in build/libs/*.jar; do
            if [ -f "$jar" ]; then
              cp "$jar" "release_artifacts/epithet-neoforge-1.21.1-1.1.0.jar"
            fi
          done

          # 2. 打包生成 Fabric 1.21.1 独立工件
          mkdir -p build/fabric_staging
          cp -r fabric/src/main/resources/* build/fabric_staging/
          if [ -d build/classes/java/main ]; then
            cp -r build/classes/java/main/* build/fabric_staging/
          fi
          cd build/fabric_staging && jar -cf ../../release_artifacts/epithet-fabric-1.21.1-1.1.0.jar * && cd ../..

          # 3. 生成全平台工件 SHA-256 校验清单
          cd release_artifacts
          sha256sum *.jar > checksums.txt
          cat checksums.txt
          cd ..

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Epithet ${{ steps.tag_info.outputs.tag }} (Multi-Platform)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/*.jar
            release_artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
